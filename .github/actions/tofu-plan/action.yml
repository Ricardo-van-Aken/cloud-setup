name: tofu-plan
description: Run OpenTofu plan in a Docker container. Set all TF_VAR_* and AWS_* env vars in the calling job.

inputs:
  working_dir:
    description: "Terraform working directory inside the container"
    required: true
  state_key:
    description: "Terraform remote state key"
    required: true
  action:
    description: "Terraform action: plan, apply, or destroy"
    required: true
  artifact_name:
    description: "Name for the uploaded plan artifact (required when action is apply or destroy)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build image
      shell: bash
      run: docker build -t cloud-setup-tofu $GITHUB_WORKSPACE

    - name: Write env file
      shell: bash
      run: printenv | grep -E '^(AWS_ACCESS_KEY_ID=|AWS_SECRET_ACCESS_KEY=|TF_VAR_)' | grep -v '=$' > /tmp/tofu.env

    - name: Start container
      shell: bash
      run: |
        docker run -d --name cloud-setup-tofu-${{ github.run_id }} \
          -w ${{ inputs.working_dir }} \
          --env-file /tmp/tofu.env \
          cloud-setup-tofu sleep infinity

    - name: Generate Backend Configuration
      shell: bash
      run: |
        docker exec cloud-setup-tofu-${{ github.run_id }} bash -c "
          source ../../scripts/common.sh
          generate_backend_file \"\$TF_VAR_region\" \"\$TF_VAR_bucket_name\" '../backend.hcl'
        "

    - name: Apply ephemerals
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working_dir }}
        STATE_KEY: ${{ inputs.state_key }}
      run: |
        EPHEMERALS_HOST_DIR="${GITHUB_WORKSPACE}${WORKING_DIR#/workspace}/ephemerals"
        if [ ! -d "${EPHEMERALS_HOST_DIR}" ]; then
          echo "[INFO] No ephemerals directory found, skipping."
          exit 0
        fi
        EPHEMERALS_STATE_KEY="${STATE_KEY%/terraform.tfstate}/ephemerals.tfstate"
        docker exec -w "${WORKING_DIR}/ephemerals" cloud-setup-tofu-${{ github.run_id }} bash -c "
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend.tf
          tofu init -reconfigure -backend-config=../backend.hcl -backend-config='key=${EPHEMERALS_STATE_KEY}'
          tofu apply -auto-approve
        "

    - name: Tofu Init
      shell: bash
      run: |
        docker exec cloud-setup-tofu-${{ github.run_id }} \
          tofu init -backend-config ../backend.hcl \
                    -backend-config="key=${{ inputs.state_key }}"

    - name: Tofu Validate
      shell: bash
      run: docker exec cloud-setup-tofu-${{ github.run_id }} tofu validate

    - name: Tofu Plan
      if: inputs.action == 'apply'
      shell: bash
      run: |
        docker exec cloud-setup-tofu-${{ github.run_id }} bash -c "
          eval \"\$(tofu -chdir=./ephemerals output -json 2>/dev/null | jq -r 'to_entries[] | \"export TF_VAR_\(.key)=\(.value.value | @sh)\"' 2>/dev/null || true)\"
          tofu plan -out=tfplan
        "

    - name: Tofu Plan (destroy)
      if: inputs.action == 'destroy'
      shell: bash
      run: |
        docker exec cloud-setup-tofu-${{ github.run_id }} bash -c "
          eval \"\$(tofu -chdir=./ephemerals output -json 2>/dev/null | jq -r 'to_entries[] | \"export TF_VAR_\(.key)=\(.value.value | @sh)\"' 2>/dev/null || true)\"
          tofu plan -destroy -out=tfplan
        "

    - name: Extract plan from container
      if: inputs.action == 'apply' || inputs.action == 'destroy'
      shell: bash
      run: docker cp cloud-setup-tofu-${{ github.run_id }}:${{ inputs.working_dir }}/tfplan tfplan

    - name: Upload plan artifact
      if: inputs.action == 'apply' || inputs.action == 'destroy'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: tfplan

    - name: Destroy ephemerals
      if: always()
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working_dir }}
        STATE_KEY: ${{ inputs.state_key }}
      run: |
        EPHEMERALS_HOST_DIR="${GITHUB_WORKSPACE}${WORKING_DIR#/workspace}/ephemerals"
        if [ ! -d "${EPHEMERALS_HOST_DIR}" ]; then
          echo "[INFO] No ephemerals directory found, skipping."
          exit 0
        fi
        EPHEMERALS_STATE_KEY="${STATE_KEY%/terraform.tfstate}/ephemerals.tfstate"
        docker exec -w "${WORKING_DIR}/ephemerals" cloud-setup-tofu-${{ github.run_id }} bash -c "
          printf 'terraform {\n  backend \"s3\" {}\n}\n' > backend.tf
          tofu init -reconfigure -backend-config=../backend.hcl -backend-config='key=${EPHEMERALS_STATE_KEY}'
          tofu destroy -auto-approve
          rm -f backend.tf
        "

    - name: Stop container
      if: always()
      shell: bash
      run: docker rm -f cloud-setup-tofu-${{ github.run_id }}
