name: foundation

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Foundation stage to run"
        required: true
        type: choice
        options:
          - 01-digitalocean-remote-state
          - 02-github-org-config
          - 03-github-org-vars
          - 04-github-repo
          - 05-github-repo-vars
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  # DigitalOcean Spaces bucket name and access key, used for terraform remote state.
  TF_VAR_region: ${{ vars.DO_STATE_BUCKET_REGION }}
  TF_VAR_bucket_name: ${{ vars.DO_STATE_BUCKET_NAME }}
  AWS_ACCESS_KEY_ID: ${{ vars.DO_STATE_BUCKET_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_STATE_BUCKET_SECRET_KEY }}

  # Terraforms DigitalOcean provider authorization.
  TF_VAR_do_org_infra_token: ${{ secrets.DO_ORG_INFRA_TOKEN }}

  # DigitalOcean project configuration.
  TF_VAR_project_name: ${{ vars.DO_org_infra_PROJECT_NAME }}
  TF_VAR_project_description: ${{ vars.DO_org_infra_PROJECT_DESCRIPTION }}
  TF_VAR_project_purpose: ${{ vars.DO_org_infra_PROJECT_PURPOSE }}
  TF_VAR_project_environment: ${{ vars.DO_org_infra_PROJECT_ENVIRONMENT }}

  # Terraforms Github provider authorization
  TF_VAR_github_organization: ${{ vars._GITHUB_ORGANIZATION_NAME }}
  TF_VAR_github_org_token: ${{ secrets._GITHUB_ORG_TOKEN }}
  TF_VAR_github_repo_token: ${{ secrets._GITHUB_REPO_TOKEN }}

  # Github repository configuration.
  TF_VAR_repository_name: ${{ vars._GITHUB_org_infra_REPOSITORY_NAME }}
  TF_VAR_repository_description: ${{ vars._GITHUB_org_infra_REPOSITORY_DESCRIPTION }}
  TF_VAR_repository_visibility: ${{ vars._GITHUB_org_infra_REPOSITORY_VISIBILITY }}
  TF_VAR_template_owner: ${{ vars._GITHUB_org_infra_TEMPLATE_OWNER }}
  TF_VAR_template_repository: ${{ vars._GITHUB_org_infra_TEMPLATE_REPOSITORY }}
  TF_VAR_is_template: ${{ vars._GITHUB_org_infra_IS_TEMPLATE }}

  # Secrets to be added by the terraform to the github repository variables/secrets.
  # TF_VAR_do_org_infra_token and TF_VAR_github_org_token are declared above and reused here.

jobs:
  terraform-plan:
    name: Tofu (${{ inputs.stage }}) - Plan
    runs-on: ubuntu-latest
    outputs:
      working_dir: ${{ steps.configure.outputs.working_dir }}
      state_key: ${{ steps.configure.outputs.state_key }}
    env:
      CONTAINER: cloud-setup-tofu-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production
          submodules: true

      - name: Configure stage
        id: configure
        run: |
          STAGE="${{ inputs.stage }}"
          case "$STAGE" in
            01-digitalocean-remote-state) STATE_NAME="digitalocean-remote-state" ;;
            02-github-org-config)         STATE_NAME="github-org-config" ;;
            03-github-org-vars)           STATE_NAME="github-org-vars" ;;
            04-github-repo)               STATE_NAME="github-repo" ;;
            05-github-repo-vars)          STATE_NAME="github-repo-vars" ;;
          esac
          echo "WORKING_DIR=/workspace/foundation/terraform/$STAGE" >> $GITHUB_ENV
          echo "STATE_KEY=foundation/$STATE_NAME/terraform.tfstate" >> $GITHUB_ENV
          echo "working_dir=/workspace/foundation/terraform/$STAGE" >> $GITHUB_OUTPUT
          echo "state_key=foundation/$STATE_NAME/terraform.tfstate" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -t cloud-setup-tofu $GITHUB_WORKSPACE

      - name: Write env file for docker container
        run: printenv | grep -E '^(TF_VAR_|AWS_ACCESS_KEY_ID=|AWS_SECRET_ACCESS_KEY=)' > /tmp/tofu.env

      - name: Start container
        run: |
          docker run -d --name $CONTAINER \
            -w $WORKING_DIR \
            --env-file /tmp/tofu.env \
            cloud-setup-tofu sleep infinity

      - name: Generate Backend Configuration
        run: |
          docker exec $CONTAINER bash -c "
            # Source the common script
            source ../../scripts/common.sh
            # Generate backend.hcl using the common function
            generate_backend_file '${{ vars.DO_STATE_BUCKET_REGION }}' '${{ vars.DO_STATE_BUCKET_NAME }}' '../backend.hcl'
          "

      - name: Tofu Init
        run: |
          docker exec $CONTAINER \
            tofu init -backend-config ../backend.hcl \
                      -backend-config="key=$STATE_KEY"

      - name: Tofu Validate
        run: docker exec $CONTAINER tofu validate

      - name: Tofu Plan (apply)
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: docker exec $CONTAINER tofu plan -out=tfplan

      - name: Tofu Plan (destroy)
        if: inputs.action == 'destroy'
        run: docker exec $CONTAINER tofu plan -destroy -out=tfplan

      - name: Extract plan from container
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: docker cp $CONTAINER:$WORKING_DIR/tfplan tfplan

      - name: Upload plan artifacts
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.stage }}
          path: tfplan

      - name: Stop container
        if: always()
        run: |
          docker rm -f $CONTAINER
          rm -f /tmp/tofu.env

  apply-approved-plan:
    name: Tofu (${{ inputs.stage }}) - Apply (after manual approval)
    if: inputs.action == 'apply' || inputs.action == 'destroy'
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production
    env:
      CONTAINER: cloud-setup-tofu-${{ github.run_id }}
      WORKING_DIR: ${{ needs.terraform-plan.outputs.working_dir }}
      STATE_KEY: ${{ needs.terraform-plan.outputs.state_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production
          submodules: true

      - name: Build image
        run: docker build -t cloud-setup-tofu $GITHUB_WORKSPACE

      - name: Download plan artifacts
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.stage }}

      - name: Write env file for docker container
        run: printenv | grep -E '^(TF_VAR_|AWS_ACCESS_KEY_ID=|AWS_SECRET_ACCESS_KEY=)' > /tmp/tofu.env

      - name: Start container
        run: |
          docker run -d --name $CONTAINER \
            -w $WORKING_DIR \
            --env-file /tmp/tofu.env \
            cloud-setup-tofu sleep infinity

      - name: Generate Backend Configuration
        run: |
          docker exec $CONTAINER bash -c "
            # Source the common script
            source ../../scripts/common.sh
            # Generate backend.hcl using the common function
            generate_backend_file '${{ vars.DO_STATE_BUCKET_REGION }}' '${{ vars.DO_STATE_BUCKET_NAME }}' '../backend.hcl'
          "

      - name: Tofu Init
        run: |
          docker exec $CONTAINER \
            tofu init -backend-config ../backend.hcl \
                      -backend-config="key=$STATE_KEY"

      - name: Inject plan into container
        run: docker cp tfplan $CONTAINER:$WORKING_DIR/tfplan

      - name: Tofu Apply (from approved plan)
        run: docker exec $CONTAINER tofu apply tfplan

      - name: Stop container
        if: always()
        run: |
          docker rm -f $CONTAINER
          rm -f /tmp/tofu.env
