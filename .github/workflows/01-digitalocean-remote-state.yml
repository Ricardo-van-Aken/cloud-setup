name: foundation - 01-digitalocean-remote-state

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan-apply"
        type: choice
        options:
          - plan-apply
          - plan-destroy
          - apply
          - destroy

env:
  AWS_ACCESS_KEY_ID: ${{ vars.DO_STATE_BUCKET_ACCESS_KEY }}
  TF_VAR_region: ${{ vars.DO_STATE_BUCKET_REGION }}
  TF_VAR_bucket_name: ${{ vars.DO_STATE_BUCKET_NAME }}
  TF_VAR_project_name: ${{ vars.DO_org_infra_PROJECT_NAME }}
  TF_VAR_project_description: ${{ vars.DO_org_infra_PROJECT_DESCRIPTION }}
  TF_VAR_project_purpose: ${{ vars.DO_org_infra_PROJECT_PURPOSE }}
  TF_VAR_project_environment: ${{ vars.DO_org_infra_PROJECT_ENVIRONMENT }}

jobs:
  plan:
    name: Tofu (01-digitalocean-remote-state) - Plan
    runs-on: ubuntu-latest
    env:
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_STATE_BUCKET_SECRET_KEY }}
      TF_VAR_do_org_infra_token: ${{ secrets.DO_ORG_INFRA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
          submodules: true
      - uses: ./.github/actions/tofu-plan
        with:
          working_dir: /workspace/foundation/terraform/01-digitalocean-remote-state
          state_key: foundation/digitalocean-remote-state/terraform.tfstate
          action: ${{ inputs.action }}
          artifact_name: terraform-plan-01-digitalocean-remote-state

  apply-approved-plan:
    name: Tofu (01-digitalocean-remote-state) - Apply (after manual approval)
    if: inputs.action == 'apply' || inputs.action == 'destroy'
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    env:
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_STATE_BUCKET_SECRET_KEY }}
      TF_VAR_do_org_infra_token: ${{ secrets.DO_ORG_INFRA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
          submodules: true
      - uses: ./.github/actions/tofu-apply
        with:
          working_dir: /workspace/foundation/terraform/01-digitalocean-remote-state
          state_key: foundation/digitalocean-remote-state/terraform.tfstate
          artifact_name: terraform-plan-01-digitalocean-remote-state
